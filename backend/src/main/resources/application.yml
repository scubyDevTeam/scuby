spring:
  application:
    name: scuby-backend
  threads:
    virtual:
      enabled: true
  jackson:
    property-naming-strategy: SNAKE_CASE
  jooq:
    sql-dialect: postgres
  flyway:
    schemas: scuby
    default-schema: scuby
    create-schemas: true

management:
  endpoints:
    web:
      exposure:
        include: health

# thin slice (docs/superpowers/specs/2026-10-29-backend-thin-slice-design.md)
scuby:
  web:
    allowed-origins: []
    origin-secret-header: X-Origin-Secret
    origin-secret: ""
    ip-hash-key: local-only-ip-hash-key
  cookies:
    secure: true
  flags:
    cache-ttl: 30s
