spring:
  application:
    name: scuby-backend
  threads:
    virtual:
      enabled: true
  jackson:
    property-naming-strategy: SNAKE_CASE
  datasource:
    hikari:
      data-source-properties:
        # The driver's error message would carry «Detail: Failing row contains (...)», personal data (decision #46).
        logServerErrorDetail: false
  jooq:
    sql-dialect: postgres
  flyway:
    schemas: scuby
    default-schema: scuby
    create-schemas: true
    # Migration versions are timestamps; a branch merged later than another may carry an older one, which
    # must still be applied (so migrations must not depend on each other's order). MigrationNamesTest.
    out-of-order: true

management:
  endpoints:
    web:
      exposure:
        include: health

# thin slice (docs/superpowers/specs/2026-10-29-backend-thin-slice-design.md)
scuby:
  web:
    allowed-origins: []
    origin-secret-header: X-Origin-Secret
    origin-secret: ""
  cookies:
    secure: true
  flags:
    cache-ttl: 30s
  sms:
    max-per-number: 5
    alarm-daily-sends: 50
  feed:
    near-radius-m: 25000
    max-items: 100
  sessions:
    cache-size: 10000
    cache-ttl: 60s
    lifetime-months: 12
  auth:
    code-hash-key: local-only-code-hash-key
    test-bypass:
      email-domains: []
      sms-prefixes: []
      code: "123456"
    google:
      client-id: local-google-client-id
      jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs
  media:
    store: local
    public-base-url: http://localhost:8080/dev-media
    # Relative to the working directory: per checkout/worktree when run from Maven (backend/target is
    # git-ignored); inside the Docker container SCUBY_MEDIA_LOCAL_DIR points at the container's own path.
    local-dir: target/dev-media
    bucket: ""
    region: ""
    slot-ttl: 5m
    attach-window: 24h
