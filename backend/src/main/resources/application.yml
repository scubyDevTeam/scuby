spring:
  application:
    name: scuby-backend
  threads:
    virtual:
      enabled: true
  jackson:
    property-naming-strategy: SNAKE_CASE
  jooq:
    sql-dialect: postgres
  flyway:
    schemas: scuby
    default-schema: scuby
    create-schemas: true
    # Migration versions are timestamps; a branch merged later than another may carry an older one, which
    # must still be applied (so migrations must not depend on each other's order). MigrationNamesTest.
    out-of-order: true

management:
  endpoints:
    web:
      exposure:
        include: health

# thin slice (docs/superpowers/specs/2026-10-29-backend-thin-slice-design.md)
scuby:
  web:
    allowed-origins: []
    origin-secret-header: X-Origin-Secret
    origin-secret: ""
    ip-hash-key: local-only-ip-hash-key
  cookies:
    secure: true
  flags:
    cache-ttl: 30s
  sms:
    max-per-number: 4
    max-per-device: 10
    max-per-ip: 20
    max-per-account: 10
    alarm-daily-sends: 50
  sessions:
    cache-size: 10000
    cache-ttl: 60s
    lifetime-months: 12
  auth:
    code-hash-key: local-only-code-hash-key
    email-max-per-device: 10
    email-max-per-ip: 20
    test-bypass:
      email-domains: []
      sms-prefixes: []
      code: "123456"
    google:
      client-id: local-google-client-id
      jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs
